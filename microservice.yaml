apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-time-service
  labels:
    app: simple-time-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-time-service
  template:
    metadata:
      labels:
        app: simple-time-service
    spec:
      containers:
      - name: simple-time-service
        image: mkmdockerhub/simple-time-service:latest
        ports:
        - containerPort: 5000

        # Ensure non-root execution
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

        # Health checks (recommended)
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: simple-time-service
spec:
  type: NodePort
  selector:
    app: simple-time-service
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30007
